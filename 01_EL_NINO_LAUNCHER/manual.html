var paginaActual = 0;

function renderIndice(){
    var ul = document.getElementById('indice-lista');
    ul.innerHTML = '';
    PAGINAS.forEach(function(p, i){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#';
        a.textContent = p.icono + ' ' + p.titulo;
        if(i === paginaActual) a.className = 'activo';
        a.onclick = function(e){ e.preventDefault(); irAPagina(i); };
        li.appendChild(a);
        ul.appendChild(li);
    });
}

function renderPagina(){
    var p = PAGINAS[paginaActual];
    var cont = document.getElementById('pagina');
    cont.innerHTML = p.contenido + '<div class="pagina-numero">Pagina ' + (paginaActual + 1) + ' de ' + PAGINAS.length + '</div>';
    cont.style.animation = 'none';
    cont.offsetHeight;
    cont.style.animation = 'pageIn 0.4s ease-out';

    // Actualizar botones
    document.getElementById('btn-prev').disabled = (paginaActual === 0);
    document.getElementById('btn-next').disabled = (paginaActual === PAGINAS.length - 1);

    // Actualizar indice
    renderIndice();

    // Scroll arriba
    window.scrollTo({top:0, behavior:'smooth'});
}

function irAPagina(n){
    if(n < 0 || n >= PAGINAS.length) return;
    paginaActual = n;
    renderPagina();
}

function paginaAnterior(){
    irAPagina(paginaActual - 1);
}

function paginaSiguiente(){
    irAPagina(paginaActual + 1);
}

// Navegacion con teclado
document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft'){ paginaAnterior(); }
    else if(e.key === 'ArrowRight'){ paginaSiguiente(); }
});

// Iniciar
renderPagina();
</script>
