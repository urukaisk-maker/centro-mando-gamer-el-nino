<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Snake - El Niño</title>
<style>
body{font-family:Arial,sans-serif;background:#0a0a0f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0}
h1{color:#00f0ff}
#board{background:#151921;border:2px solid #00f0ff}
#info{text-align:center;margin:15px}
#score{font-size:1.5em;color:#ff00ff}
button{background:#00f0ff;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;font-size:1em;color:#000;margin-top:10px}
button:hover{background:#ff00ff;color:#fff}
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<div id="info"><p>Puntuación: <span id="score">0</span></p><button onclick="newGame()">Nuevo juego</button></div>
<canvas id="board" width="400" height="400"></canvas>
<script>
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
let snake, dir, food, score, gameOver, speed;
function newGame(){
    snake=[{x:10,y:10}];
    dir={x:1,y:0};
    food={x:15,y:10};
    score=0;
    speed=150;
    gameOver=false;
    draw();
    if(!interval) interval=setInterval(tick,speed);
}
function draw(){
    ctx.fillStyle='#151921';
    ctx.fillRect(0,0,400,400);
    ctx.fillStyle='#00f0ff';
    for(let i=0;i<snake.length;i++) ctx.fillRect(snake[i].x*20,snake[i].y*20,18,18);
    ctx.fillStyle='#ff00ff';
    ctx.fillRect(food.x*20,food.y*20,18,18);
}
function tick(){
    if(gameOver) return;
    let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver=true;alert('Game Over!');return;}
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){score+=10;document.getElementById('score').textContent=score;spawnFood();}
    else snake.pop();
    draw();
}
function spawnFood(){
    food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
}
document.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'&&dir.y!==1) dir={x:0,y:-1};
    else if(e.key==='ArrowDown'&&dir.y!==-1) dir={x:0,y:1};
    else if(e.key==='ArrowLeft'&&dir.x!==1) dir={x:-1,y:0};
    else if(e.key==='ArrowRight'&&dir.x!==-1) dir={x:1,y:0};
});
let interval;
newGame();
</script>
</body>
</html>
