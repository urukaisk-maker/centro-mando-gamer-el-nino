<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mando El Nino</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{min-height:100%;height:auto;overflow-x:hidden;overflow-y:auto;background:#0a0a0f;color:#fff;font-family:sans-serif;touch-action:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;background-image:radial-gradient(circle at 30% 30%,rgba(0,240,255,0.12),transparent 50%),radial-gradient(circle at 70% 70%,rgba(255,0,255,0.12),transparent 50%)}
.contenedor{width:100%;max-width:900px;min-height:100vh;display:flex;flex-direction:column;padding:1rem}
.header{text-align:center;padding:0.8rem;background:linear-gradient(90deg,#00f0ff,#ff00ff);color:#000;font-weight:900;letter-spacing:3px;font-size:1rem;border-radius:14px;margin-bottom:0.5rem;box-shadow:0 0 25px rgba(0,240,255,0.5)}
.estado{text-align:center;padding:0.4rem;font-size:0.8rem;color:#8899aa;margin-bottom:0.5rem}
.estado.ok{color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,0.6)}
.estado.err{color:#ff0044;text-shadow:0 0 8px rgba(255,0,68,0.6)}
.gamepad{flex:1;display:flex;justify-content:space-between;align-items:center;padding:0 1rem;position:relative;gap:1rem;min-height:280px}
.zona{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
/* D-PAD */
.dpad{display:grid;grid-template-columns:repeat(3,75px);grid-template-rows:repeat(3,75px);gap:6px}
.dpad-btn{background:linear-gradient(145deg,#1a1a24,#12121a);border:2px solid rgba(0,240,255,0.6);color:#00f0ff;border-radius:14px;font-size:1.6rem;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.1s;font-family:inherit;box-shadow:0 0 18px rgba(0,240,255,0.3),inset 0 0 10px rgba(0,240,255,0.1)}
.dpad-btn:hover{box-shadow:0 0 25px rgba(0,240,255,0.5),inset 0 0 15px rgba(0,240,255,0.2)}
.dpad-btn:active,.dpad-btn.activo{background:linear-gradient(145deg,#00f0ff,#0088ff);color:#000;box-shadow:0 0 35px rgba(0,240,255,1);transform:scale(0.9)}
.dpad-btn.vacio{visibility:hidden}
/* BOTONES A/B/X/Y */
.acciones{display:grid;grid-template-columns:repeat(2,90px);grid-template-rows:repeat(2,90px);gap:10px}
.accion-btn{background:linear-gradient(145deg,#1a1a24,#12121a);border:3px solid;border-radius:50%;font-size:1.6rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.1s;font-family:inherit}
.accion-btn.a{border-color:#00ff88;color:#00ff88;box-shadow:0 0 20px rgba(0,255,136,0.5),inset 0 0 12px rgba(0,255,136,0.2)}
.accion-btn.b{border-color:#ff0044;color:#ff0044;box-shadow:0 0 20px rgba(255,0,68,0.5),inset 0 0 12px rgba(255,0,68,0.2)}
.accion-btn.x{border-color:#00f0ff;color:#00f0ff;box-shadow:0 0 20px rgba(0,240,255,0.5),inset 0 0 12px rgba(0,240,255,0.2)}
.accion-btn.y{border-color:#ff00ff;color:#ff00ff;box-shadow:0 0 20px rgba(255,0,255,0.5),inset 0 0 12px rgba(255,0,255,0.2)}
.accion-btn:active,.accion-btn.activo{transform:scale(0.88);color:#000}
.accion-btn.a:active,.accion-btn.a.activo{background:#00ff88;box-shadow:0 0 40px rgba(0,255,136,1)}
.accion-btn.b:active,.accion-btn.b.activo{background:#ff0044;box-shadow:0 0 40px rgba(255,0,68,1)}
.accion-btn.x:active,.accion-btn.x.activo{background:#00f0ff;box-shadow:0 0 40px rgba(0,240,255,1)}
.accion-btn.y:active,.accion-btn.y.activo{background:#ff00ff;box-shadow:0 0 40px rgba(255,0,255,1)}
/* BOTONES DE HOMBRO */
.hombros{position:absolute;top:-0.5rem;left:0;right:0;display:flex;justify-content:space-between;padding:0 1rem;z-index:10;pointer-events:none}
.hombro-btn{background:linear-gradient(145deg,#1a1a24,#12121a);border:2px solid #ff8800;color:#ff8800;border-radius:14px;padding:0.7rem 1.5rem;font-size:0.85rem;font-weight:bold;cursor:pointer;font-family:inherit;transition:all 0.1s;pointer-events:auto;box-shadow:0 0 15px rgba(255,136,0,0.4)}
.hombro-btn:active,.hombro-btn.activo{background:#ff8800;color:#000;box-shadow:0 0 30px rgba(255,136,0,1);transform:scale(0.95)}
/* BOTONES SISTEMA */
.inferior{display:flex;justify-content:center;gap:1rem;padding:1rem;flex-wrap:wrap}
.sistema-btn{background:linear-gradient(145deg,#1a1a24,#12121a);border:2px solid #8899aa;color:#8899aa;border-radius:30px;padding:0.7rem 1.5rem;font-size:0.85rem;font-weight:bold;cursor:pointer;font-family:inherit;transition:all 0.1s;box-shadow:0 0 12px rgba(136,153,170,0.3)}
.sistema-btn:active,.sistema-btn.activo{background:#8899aa;color:#000;box-shadow:0 0 25px rgba(136,153,170,0.8);transform:scale(0.95)}
.info{text-align:center;padding:0.5rem;font-size:0.7rem;color:#666;font-style:italic}
/* RESPONSIVE */
@media(max-width:768px){
.contenedor{max-height:100%;padding:0.5rem}
.dpad{grid-template-columns:repeat(3,65px);grid-template-rows:repeat(3,65px)}
.acciones{grid-template-columns:repeat(2,75px);grid-template-rows:repeat(2,75px)}
.dpad-btn{font-size:1.4rem}
.accion-btn{font-size:1.4rem}
.hombros{position:static;justify-content:center;margin-bottom:0.5rem}
.header{font-size:0.85rem;padding:0.6rem}
}
@media(max-width:500px){
.dpad{grid-template-columns:repeat(3,55px);grid-template-rows:repeat(3,55px);gap:4px}
.acciones{grid-template-columns:repeat(2,65px);grid-template-rows:repeat(2,65px);gap:6px}
.contenedor{padding:0.4rem;min-height:100vh}
.gamepad{min-height:auto;padding:0.5rem 0;gap:0.5rem}
.inferior{padding:0.5rem;gap:0.4rem}
.sistema-btn{padding:0.5rem 0.9rem;font-size:0.75rem}
.info{padding:0.3rem;font-size:0.65rem}
.header{font-size:0.8rem;padding:0.5rem;letter-spacing:2px}
.estado{font-size:0.7rem;padding:0.2rem}
.hombros{margin-bottom:0.3rem}
.hombro-btn{padding:0.5rem 1rem;font-size:0.75rem}
}
</style>
</head>
<body>
<div class="contenedor">
<div class="header">🎮 MANDO EL NINO</div>
<div class="estado" id="estado">Conectando...</div>

<div class="hombros">
<button class="hombro-btn" data-key="q">L1</button>
<button class="hombro-btn" data-key="e">R1</button>
</div>

<div class="gamepad">
<div class="zona">
<div class="dpad">
<button class="dpad-btn vacio"></button>
<button class="dpad-btn" data-key="Up">▲</button>
<button class="dpad-btn vacio"></button>
<button class="dpad-btn" data-key="Left">◀</button>
<button class="dpad-btn vacio"></button>
<button class="dpad-btn" data-key="Right">▶</button>
<button class="dpad-btn vacio"></button>
<button class="dpad-btn" data-key="Down">▼</button>
<button class="dpad-btn vacio"></button>
</div>
</div>

<div class="zona">
<div class="acciones">
<button class="accion-btn y" data-key="a">Y</button>
<button class="accion-btn x" data-key="s">X</button>
<button class="accion-btn b" data-key="x">B</button>
<button class="accion-btn a" data-key="z">A</button>
</div>
</div>
</div>

<div class="inferior">
<button class="sistema-btn" data-key="Shift">SELECT</button>
<button class="sistema-btn" data-key="Return">START</button>
<button class="sistema-btn" data-key="Escape">ESC</button>
</div>

<div class="info">Conecta el movil al WiFi del PC y abre esta pagina</div>
</div>

<script>
var SERVIDOR = window.location.origin;
var estado = document.getElementById("estado");
function actualizarEstado(t,c){estado.textContent=t;estado.className="estado "+(c||"");}
function enviarTecla(tecla,tipo){
    var url = SERVIDOR + "/tecla";
    if(tipo==="down") url += "-down";
    else if(tipo==="up") url += "-up";
    url += "/" + encodeURIComponent(tecla);
    fetch(url).then(function(r){if(r.ok)actualizarEstado("Conectado al PC","ok");else actualizarEstado("Error de conexion","err");}).catch(function(){actualizarEstado("PC no accesible. Verifica la WiFi.","err");});
}
document.querySelectorAll("[data-key]").forEach(function(btn){
    var tecla = btn.getAttribute("data-key");
    btn.addEventListener("touchstart",function(e){e.preventDefault();btn.classList.add("activo");enviarTecla(tecla,"down");},{passive:false});
    btn.addEventListener("touchend",function(e){e.preventDefault();btn.classList.remove("activo");enviarTecla(tecla,"up");},{passive:false});
    btn.addEventListener("touchcancel",function(e){btn.classList.remove("activo");enviarTecla(tecla,"up");});
    btn.addEventListener("mousedown",function(e){e.preventDefault();btn.classList.add("activo");enviarTecla(tecla,"down");});
    btn.addEventListener("mouseup",function(e){e.preventDefault();btn.classList.remove("activo");enviarTecla(tecla,"up");});
    btn.addEventListener("mouseleave",function(e){if(btn.classList.contains("activo")){btn.classList.remove("activo");enviarTecla(tecla,"up");}});
});
fetch(SERVIDOR + "/estado").then(function(){actualizarEstado("Conectado al PC","ok");}).catch(function(){actualizarEstado("No se puede conectar al PC","err");});
</script>
</body>
</html>
